[project]
name = "keyrelay"
version = "0.1.0"
description = "A local, encrypted credential broker for browser agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46.0.2",
  "fastapi>=0.118.0",
  "jinja2>=3.1.6",
  "playwright>=1.55.0",
  "pydantic-settings>=2.11.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.37.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.2",
  "ruff>=0.13.3",
]

[project.scripts]
keyrelay = "keyrelay.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyrelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
